[project]
name = "ai-agent-hub"
version = "0.9.14"
description = "Intranet hub where local coding agents register and delegate tasks to each other"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0,<4",
    "minio>=7.2,<8",
    "PyJWT>=2.9,<3",
    "starlette>=0.40,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
agent-hub = "agent_hub.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub"]

[tool.hatch.build]
artifacts = ["src/agent_hub/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
